openapi: 3.1.1
info:
  title: Campus Radar Local Monitoring Contract
  version: 0.1.0
  description: >-
    Proposed, not implemented. Companion to IC-003-monitoring-module.md.
    V1 monitors saved items only. Local backend Bearer authentication is distinct
    from upstream website cookies. Cross-field, scope, identity and transition
    constraints in IC-003 are mandatory in addition to schema validation.
servers:
  - url: http://127.0.0.1:8080/api/monitor/v1
security:
  - LocalBearer: []
x-implementation-status: proposed
x-transport-policy:
  loopback_only: true
  cache_control: no-store
  cookie_request_max_bytes: 262144
  other_request_max_bytes: 2097152
  secret_logging: forbidden
paths:
  /capabilities:
    get:
      operationId: getMonitorCapabilities
      summary: Discover installed and verified adapter capabilities
      responses:
        '200':
          description: Supported contract, runtime epoch and registered adapters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        default: {$ref: '#/components/responses/Error'}
  /bridges/{bridge_id}/presence:
    parameters:
      - {name: bridge_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: updateBridgePresence
      summary: Renew a local browser-presence lease; no remote keepalive request
      description: >-
        Exact registered extension Origin and instance binding required.
        Increasing sequence renews a 180-second lease; identical sequence returns
        the original lease without renewal; lower sequence returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PresenceInput'}
      responses:
        '200':
          description: Presence acknowledged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Presence'}
        default: {$ref: '#/components/responses/Error'}
  /auth-contexts:
    post:
      operationId: createAuthContext
      summary: Create an empty, owner-scoped browser credential context
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthCreate'}
      responses:
        '201':
          description: Created, or original idempotent creation replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthContext'}
        default: {$ref: '#/components/responses/Error'}
  /auth-contexts/{auth_id}:
    parameters:
      - {$ref: '#/components/parameters/AuthId'}
    get:
      operationId: getAuthContext
      summary: Read metadata only; never return cookie values
      responses:
        '200':
          description: Authentication state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthContext'}
        default: {$ref: '#/components/responses/Error'}
  /auth-contexts/{auth_id}/cookies:
    parameters:
      - {$ref: '#/components/parameters/AuthId'}
    put:
      operationId: importCookieSnapshot
      summary: Stage an explicitly authorized, scoped cookie snapshot
      description: >-
        Requires an allowed extension Origin, context/bridge/store ownership,
        current backend_epoch and expected_revision. 202 is not proof of login.
        Authenticated GET validation occurs in the next permitted monitoring round.
        Active contexts require manual_reauthorize. Cookie values are write-only,
        memory-only, never logged, never returned. Partitioned/incognito cookies
        and central identity-provider cookies are unsupported.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CookieImport'}
      responses:
        '202':
          description: Snapshot accepted, context unverified
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthContext'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeCookieSnapshot
      summary: Revoke local credentials and invalidate outstanding execution generations
      description: >-
        Requires the registered extension Origin. Does not log the user out of
        Moodle in Chrome. A repeated revoke of an already-revoked context succeeds.
      parameters:
        - name: expected_revision
          in: query
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '204': {description: Credentials revoked; no response body}
        default: {$ref: '#/components/responses/Error'}
  /sources:
    get:
      operationId: listMonitorSources
      summary: List only the authenticated owner's monitor sources
      parameters:
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Sources ordered by stable source_id; opaque next cursor
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sources, next_cursor]
                properties:
                  sources: {type: array, items: {$ref: '#/components/schemas/MonitorSource'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: registerMonitorSource
      summary: Register saved items; merge targets for an existing canonical source
      description: >-
        Validate item ownership and derive canonical URL/locators from saved
        records. All items must belong to one source page. Reject unsupported
        locators/adapters. Public sources require auth_id null. Cookie sources
        require a matching site/bridge auth context. Not a general URL fetch API.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourceRegister'}
      responses:
        '201':
          description: New source created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorSource'}
        '200':
          description: Targets merged into existing source
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorSource'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{source_id}:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    get:
      operationId: getMonitorSource
      summary: Read configuration and runtime state
      responses:
        '200':
          description: Source metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorSource'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateMonitorSource
      summary: Change enabled or interval; identity and credentials are immutable here
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SourcePatch'}
      responses:
        '200':
          description: Updated source configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitorSource'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{source_id}/checks:
    parameters:
      - {$ref: '#/components/parameters/SourceId'}
    post:
      operationId: requestMonitorCheck
      summary: Queue or coalesce a check without bypassing authentication or rate limits
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: New or existing pending check
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        default: {$ref: '#/components/responses/Error'}
  /checks/{check_id}:
    parameters:
      - {name: check_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getMonitorCheck
      summary: Read execution and business-application results
      responses:
        '200':
          description: Upstream failures appear in the result, not as local API 401
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Check'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    LocalBearer:
      type: http
      scheme: bearer
      description: Existing local backend login token; never a Moodle cookie or CAS ticket
  parameters:
    AuthId:
      name: auth_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SourceId:
      name: source_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: Owner/method/path scoped; differing payload on the same key returns 409
  responses:
    Error:
      description: >-
        401 local unauthorized; 403 origin/binding denied; 404 inaccessible resource;
        409 revision/idempotency/epoch/account conflict or unsupported capability;
        413 too large; 422 invalid or cookie scope/partition unsupported;
        429 local rate limited; 503 unavailable. No secret values in errors.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Timestamp:
      type: [number, 'null']
      minimum: 0
      description: UTC Unix seconds; null means unknown or not yet observed
    Error:
      type: object
      additionalProperties: false
      required: [error, message, retryable, retry_after_s, request_id]
      properties:
        error: {type: string, maxLength: 80}
        message: {type: string, maxLength: 300}
        retryable: {type: boolean}
        retry_after_s: {type: [number, 'null'], minimum: 0}
        request_id: {type: string, format: uuid}
    Capabilities:
      type: object
      additionalProperties: false
      required: [contract_version, backend_epoch, heartbeat_interval_s, presence_ttl_s, adapters]
      properties:
        contract_version: {type: string, const: '1'}
        backend_epoch: {type: string, format: uuid}
        heartbeat_interval_s: {type: integer, const: 60}
        presence_ttl_s: {type: integer, const: 180}
        adapters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [site_key, adapter_id, origin, auth_mode, allowed_cookie_names, watch_modes, min_interval_s, monitoring_supported]
            properties:
              site_key: {type: string, maxLength: 80}
              adapter_id: {type: string, maxLength: 80}
              origin: {type: string, format: uri}
              auth_mode: {type: string, enum: [none, browser_cookie]}
              allowed_cookie_names: {type: array, uniqueItems: true, items: {type: string}}
              watch_modes: {type: array, uniqueItems: true, items: {type: string, const: selected_items}}
              min_interval_s: {type: integer, minimum: 600}
              monitoring_supported: {type: boolean}
    PresenceInput:
      type: object
      additionalProperties: false
      required: [extension_id, sequence, monitoring_enabled]
      properties:
        extension_id: {type: string, pattern: '^[a-p]{32}$'}
        sequence: {type: integer, minimum: 1}
        monitoring_enabled: {type: boolean}
    Presence:
      type: object
      additionalProperties: false
      required: [bridge_id, backend_epoch, sequence, expires_at, monitoring_enabled]
      properties:
        bridge_id: {type: string, format: uuid}
        backend_epoch: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        expires_at: {type: number, minimum: 0}
        monitoring_enabled: {type: boolean}
    AuthCreate:
      type: object
      additionalProperties: false
      required: [site_key, bridge_id, cookie_store_id, consented]
      properties:
        site_key: {type: string, maxLength: 80}
        bridge_id: {type: string, format: uuid}
        cookie_store_id: {type: string, minLength: 1, maxLength: 100}
        consented: {type: boolean, const: true}
    AuthContext:
      type: object
      additionalProperties: false
      required: [auth_id, site_key, bridge_id, cookie_store_id, revision, generation, state, last_validated_at, idle_timeout_hint_s]
      properties:
        auth_id: {type: string, format: uuid}
        site_key: {type: string}
        bridge_id: {type: string, format: uuid}
        cookie_store_id: {type: string}
        revision: {type: integer, minimum: 0}
        generation: {type: integer, minimum: 0}
        state: {type: string, enum: [needs_credentials, unverified, valid, auth_required, revoked]}
        last_validated_at: {$ref: '#/components/schemas/Timestamp'}
        idle_timeout_hint_s:
          type: [integer, 'null']
          minimum: 1
          description: Observed server idle policy hint, never cookie expiry or an uptime guarantee
    Cookie:
      type: object
      additionalProperties: false
      required: [name, value, domain, path, host_only, secure, http_only, same_site, session, expires_at]
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        value: {type: string, maxLength: 4096, writeOnly: true}
        domain: {type: string, minLength: 1, maxLength: 253}
        path: {type: string, pattern: '^/', maxLength: 2048}
        host_only: {type: boolean}
        secure: {type: boolean}
        http_only: {type: boolean}
        same_site: {type: string, enum: [unspecified, no_restriction, lax, strict]}
        session: {type: boolean}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        partition_key: {type: 'null', description: Only unpartitioned cookies supported in V1}
      allOf:
        - if:
            properties:
              session: {const: true}
          then:
            properties:
              expires_at: {type: 'null'}
          else:
            properties:
              expires_at: {type: number, minimum: 0}
    CookieImport:
      type: object
      additionalProperties: false
      required: [backend_epoch, expected_revision, reason, confirmed_same_account, cookies]
      properties:
        backend_epoch: {type: string, format: uuid}
        expected_revision: {type: integer, minimum: 0}
        reason: {type: string, enum: [initial, backend_restart, auth_required, manual_reauthorize]}
        confirmed_same_account:
          type: boolean
          description: True only after explicit user confirmation, never inferred from cookie possession
        cookies:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: '#/components/schemas/Cookie'}
    SourceRegister:
      type: object
      additionalProperties: false
      required: [site_key, adapter_id, bridge_id, auth_id, item_ids, watch_mode]
      properties:
        site_key: {type: string, maxLength: 80}
        adapter_id: {type: string, maxLength: 80}
        bridge_id: {type: string, format: uuid}
        auth_id: {type: [string, 'null'], format: uuid}
        item_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: integer, minimum: 1}
        watch_mode: {type: string, const: selected_items}
        interval_s: {type: integer, minimum: 600, maximum: 86400, default: 600}
    SourcePatch:
      type: object
      additionalProperties: false
      required: [expected_revision]
      anyOf:
        - required: [enabled]
        - required: [interval_s]
      properties:
        expected_revision: {type: integer, minimum: 1}
        enabled: {type: boolean}
        interval_s: {type: integer, minimum: 600, maximum: 86400}
    MonitorSource:
      type: object
      additionalProperties: false
      required: [source_id, revision, site_key, adapter_id, canonical_url, bridge_id, auth_id, watch_mode, item_ids, enabled, interval_s, runtime_status, last_attempt_at, last_success_at, next_check_at, last_check_id]
      properties:
        source_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        site_key: {type: string}
        adapter_id: {type: string}
        canonical_url: {type: string, format: uri, maxLength: 2048}
        bridge_id: {type: string, format: uuid}
        auth_id: {type: [string, 'null'], format: uuid}
        watch_mode: {type: string, const: selected_items}
        item_ids: {type: array, uniqueItems: true, items: {type: integer, minimum: 1}}
        enabled: {type: boolean}
        interval_s: {type: integer, minimum: 600, maximum: 86400}
        runtime_status: {type: string, enum: [ready, waiting_browser, waiting_auth, paused, backoff, unsupported]}
        last_attempt_at: {$ref: '#/components/schemas/Timestamp'}
        last_success_at: {$ref: '#/components/schemas/Timestamp'}
        next_check_at: {$ref: '#/components/schemas/Timestamp'}
        last_check_id: {type: [string, 'null'], format: uuid}
    TargetResult:
      type: object
      additionalProperties: false
      required: [item_id, status, last_success_at, error]
      properties:
        item_id: {type: integer, minimum: 1}
        status: {type: string, enum: [changed, unchanged, failed, superseded]}
        last_success_at: {$ref: '#/components/schemas/Timestamp'}
        error:
          oneOf:
            - {$ref: '#/components/schemas/Error'}
            - {type: 'null'}
    Check:
      type: object
      additionalProperties: false
      required: [check_id, source_id, source_revision, state, outcome, queued_at, planned_at, started_at, finished_at, results, error]
      properties:
        check_id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        source_revision: {type: integer, minimum: 1}
        state: {type: string, enum: [queued, running, processing, succeeded, failed, cancelled, superseded]}
        outcome: {type: [string, 'null'], enum: [changed, unchanged, partial, failed, null]}
        queued_at: {type: number, minimum: 0}
        planned_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        finished_at: {$ref: '#/components/schemas/Timestamp'}
        results: {type: array, items: {$ref: '#/components/schemas/TargetResult'}}
        error:
          oneOf:
            - {$ref: '#/components/schemas/Error'}
            - {type: 'null'}
