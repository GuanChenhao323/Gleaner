<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="24" height="24">
    <strong>Campus Radar</strong>
    <span class="muted" id="account"></span>
  </header>

  <!-- 未登录：填写本地后端地址与账号 -->
  <section id="login-view" hidden>
    <p class="muted">登录本地后端后，就能把网页上的事项保存到工作台。插件只保存登录令牌，不保存密码。</p>
    <label>后端地址<input id="server" type="url" placeholder="http://localhost:8080" required></label>
    <label>邮箱<input id="email" type="email" autocomplete="username" required></label>
    <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
    <button id="login" class="primary">登录</button>
  </section>

  <!-- 已登录：当前页面的候选事项 -->
  <section id="main-view" hidden>
    <div class="page">
      <div id="page-title" class="title"></div>
      <div id="page-url" class="url"></div>
      <div id="page-note" class="muted small"></div>
    </div>

    <div id="pick" hidden>
      <div class="pick-head">
        <span id="pick-count" class="muted small"></span>
        <a href="#" id="pick-all" class="small">全选</a>
      </div>
      <ul id="candidates" class="candidates"></ul>
    </div>

    <label class="check"><input type="checkbox" id="monitor" checked> 保存后定期检查来源变化</label>
    <p class="muted small" id="monitor-note">需要允许插件访问这个网站；只在 Chrome 和本地后端都运行时检查。</p>

    <button id="save" class="primary" disabled>保存选中的事项</button>
    <ul id="results" class="results" hidden></ul>

    <details class="legacy">
      <summary class="muted small">其他：订阅整个页面（旧功能）</summary>
      <div id="feed-choice" hidden>
        <label class="radio"><input type="radio" name="sub" value="rss" checked> 订阅 RSS（推荐）</label>
        <label class="radio"><input type="radio" name="sub" value="page"> 监测整个页面</label>
      </div>
      <button id="subscribe">订阅更新</button>
      <p class="muted small">订阅后服务器会把页面上所有新内容加入收件箱；需要登录才能看的页面，服务器可能取不到。</p>
    </details>
  </section>

  <div id="status" role="status"></div>

  <footer id="footer" hidden>
    <a href="#" id="open">打开工作台</a>
    <a href="#" id="logout">退出</a>
  </footer>

  <script src="candidates.js"></script>
  <script src="popup.js"></script>
</body>
</html>
