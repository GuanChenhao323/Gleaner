<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="拾课 Gleaner：把 Moodle 作业、学院通知、学校邮箱整理成你的作业列表、日历和收件箱。">
  <meta name="theme-color" content="#121417">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="拾课 Gleaner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=g1">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png?v=g1"/>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=g1"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=g1"/>
  <title>拾课 Gleaner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F7F7F5; }
    @media (prefers-color-scheme: dark) { html, body { background: #F7F7F5; } }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; color: #121417; }
    #splash .logo { width: 72px; height: 72px; border-radius: 22px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(18,20,23,.35); animation: breathe 1.6s ease-in-out infinite; }
    #splash .logo img { width: 100%; height: 100%; display: block; }
    #splash .name { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(18,20,23,.15); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #E0A43A; animation: slide 1.1s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(1.06); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash"><div class="logo"><img src="assets/assets/logo.png" alt="拾课 Gleaner"></div><div class="name">拾课 Gleaner</div><div class="bar"></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
