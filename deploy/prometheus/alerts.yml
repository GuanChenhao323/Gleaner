groups:
  - name: gleaner
    rules:
      - alert: PushNodeDown
        expr: gleaner_upstream_up{pool="push"} == 0
        for: 30s
        labels: {severity: page}
        annotations: {summary: "推送节点 {{ $labels.node }} 不健康"}
      - alert: FetchFailureRateHigh
        expr: sum(rate(gleaner_source_checks_total{result="failed"}[10m])) / clamp_min(sum(rate(gleaner_source_checks_total[10m])), 1e-9) > 0.3
        for: 10m
        annotations: {summary: "采集失败率超过 30%"}
      - alert: PushLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(gleaner_push_latency_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        annotations: {summary: "推送延迟 P99 超过 1 秒"}
