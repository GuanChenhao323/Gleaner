global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8080"]}]
  - job_name: core
    static_configs: [{targets: ["core:8081"]}]
  - job_name: push
    static_configs: [{targets: ["push1:8100", "push2:8100"]}]
  - job_name: broker
    static_configs: [{targets: ["broker:9101"]}]
  - job_name: collector
    static_configs: [{targets: ["collector:9102"]}]
